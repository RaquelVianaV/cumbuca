<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Cumbuca | Ferramentas</title>
    <meta name="description" content="Ferramentas online para fluxo de caixa, menu semanal e precificação da Cumbuca." />
    <meta name="theme-color" content="#087f5b">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Cumbuca">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <link rel="manifest" href="/manifest.json">
    <link rel="apple-touch-icon" href="/logo-cumbuca.svg">
    <link rel="preload" href="/app.js?v=20260711-01" as="script">
    <link rel="preload" href="/logo-cumbuca.svg" as="image">
    <link rel="stylesheet" href="/styles.css?v=20260711-01">
    <script>
      (function () {
        const storedTheme = localStorage.getItem('cumbuca-theme');
        const theme = ['light', 'dark', 'system'].includes(storedTheme) ? storedTheme : 'system';
        const isDark =
          theme === 'dark' ||
          (theme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        if (isDark) {
          document.documentElement.classList.add('dark-mode');
        }
        if (theme !== 'system') {
          document.documentElement.setAttribute('data-theme-override', theme);
        }
      })();
    </script>
  </head>
  <body>
    <header class="app-header">
      <a class="brand" href="/" aria-label="Cumbuca">
        <span class="brand-mark">C</span>
        <span>Cumbuca</span>
      </a>
      <div class="header-tools">
        <details class="status-group" id="system-status-details">
          <summary class="system-status-summary" id="system-status-summary">Verificando sistema</summary>
          <div class="status-details" aria-label="Detalhes do status do sistema">
            <span class="server-status" id="server-status">Servidor verificando</span>
            <span class="server-status" id="database-status">Banco verificando</span>
            <span class="server-status" id="save-status">Salvamento verificando</span>
          </div>
        </details>
        <div class="header-actions">
          <span class="current-user" id="current-user"></span>
          <time class="today-date" id="today-date"></time>
          <button class="secondary theme-toggle" type="button" id="theme-toggle-button" title="Ativar modo escuro" aria-label="Ativar modo escuro" aria-pressed="false">
            <span class="theme-toggle-icon" aria-hidden="true">&#127769;</span>
            <span class="theme-toggle-label">Claro</span>
            <span class="theme-toggle-track" aria-hidden="true">
              <span class="theme-toggle-thumb"></span>
            </span>
          </button>
          <a class="secondary table-action account-button" href="/minha-conta" data-route="minha-conta">Conta</a>
          <button class="secondary backup-button" type="button" id="backup-button">Backup</button>
          <button class="secondary logout-button" type="button" id="logout-button">Sair</button>
        </div>
      </div>
    </header>

    <div class="app-frame">
      <aside class="sidebar" aria-label="Ferramentas">
        <nav class="nav">
          <a href="/fluxo-de-caixa" data-route="fluxo-de-caixa">Caixa</a>
          <a href="/hoje" data-route="hoje">Hoje</a>
          <a href="/pedidos" data-route="pedidos">Pedidos</a>
          <a class="nav-extra" href="/menu-semanal" data-route="menu-semanal">Menu</a>
          <a class="nav-extra" href="/loja" data-route="loja">Loja</a>
          <a href="/financeiro" data-route="financeiro">Financeiro</a>
          <a class="nav-extra" href="/precificacao" data-route="precificacao">Preços</a>
          <a class="nav-extra" href="/relatorios" data-route="relatorios">Relatórios</a>
          <a class="nav-extra" href="/alertas" data-route="alertas">Alertas</a>
          <a class="nav-extra" href="/configuracoes" data-route="configuracoes">Config.</a>
          <a class="nav-extra" href="/backups" data-route="backups">Manutenção</a>
          <a class="nav-more" href="/mais" data-route="mais">Mais</a>
        </nav>
      </aside>

      <main class="shell">
        <section class="hero">
          <p class="eyebrow">Operação Cumbuca</p>
          <img class="hero-logo" src="/logo-cumbuca.svg" alt="Cumbuca comida saudável">
          <h1 id="page-title">Cumbuca</h1>
        </section>

        <section id="app" class="workspace" aria-live="polite"></section>
      </main>
    </div>

    <script src="/app.js?v=20260711-01" defer></script>
    <script src="/sw-register.js" defer></script>
  </body>
</html>
